<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Roboto:wght@500&display=swap" rel="stylesheet">
<style>

:root{--navy:#00004D;--ink:#000027;--mid:#000E31;--lav:#A1A1D0;--ice:#EEF6FF;--gold:#FFC03B;--paper:#F8F9FA;--white:#FFFFFF;--body:#1A1A1A;--muted:#69727D;
--line:#D9D9E4;--soft:#F3F3F7;--h:'Montserrat',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--body);font:16px/1.55 var(--b);overflow-x:hidden}
img{display:block;max-width:100%}a{color:var(--navy)}
h1,h2,h3,h4{font-family:var(--h);color:var(--navy);margin:0;letter-spacing:-.01em}
.wrap{max-width:1300px;margin:0 auto;padding:0 32px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.bar-in{max-width:1300px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mark img{width:38px;height:38px}
.bar.dk .mark{color:#fff}.mark b{font:800 14px/1 var(--h);letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.cl{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;font:800 16px/1 var(--h)}
.nav{position:relative;display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;white-space:nowrap;padding:20px 7px;font:600 14px/1 var(--h);color:#3A3A75;text-decoration:none;transition:color .2s}
.nav a:hover{color:var(--navy)}
.nav a.on{color:var(--navy)}
.nav a.on::after{content:"";position:absolute;left:7px;right:7px;bottom:12px;height:3px;border-radius:2px;background:var(--navy);animation:ink .45s ease both}
@keyframes ink{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav .s{display:none}
.tools{display:flex;gap:8px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font:600 14px/1 var(--h);cursor:pointer}
.tbtn:hover{border-color:var(--navy)}
.tbtn .knob{width:26px;height:15px;border-radius:999px;background:var(--navy);position:relative}
.tbtn .knob::after{content:"";position:absolute;top:2px;left:14px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s}
html.still .tbtn .knob{background:#9AA0AA}html.still .tbtn .knob::after{left:2px}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* page head */
.ph{padding-top:44px;padding-bottom:26px}
.kick{font:700 14px/1 var(--h);letter-spacing:.16em;text-transform:uppercase;color:#4A4A81;margin:0 0 12px}
.ph h1{font-size:40px;line-height:1.1;font-weight:800}
.ph p{max-width:760px;margin:12px 0 0;color:#3A3A75;font-size:17px}
/* status chips: words + a drawn switch */
.st{display:inline-flex;align-items:center;gap:8px;font:600 14px/1.2 var(--b);color:var(--navy);white-space:nowrap}
.st .sw{flex:none;width:24px;height:14px;border-radius:999px;position:relative;background:var(--navy)}
.st .sw::after{content:"";position:absolute;top:2px;left:12px;width:10px;height:10px;border-radius:50%;background:#fff}
.st-quiet .sw{background:#fff;border:1.5px solid var(--navy)}.st-quiet .sw::after{top:1px;left:11px;background:var(--navy)}
.st-off{color:#4F5560}.st-off .sw{background:#C9CCD3}.st-off .sw::after{left:2px}
.st-notbuilt{color:#4F5560}.st-notbuilt .sw{background:transparent;border:1.5px dashed #8A909A}.st-notbuilt .sw::after{display:none}
.st-ask{color:var(--ink)}.st-ask .sw{background:var(--gold)}.st-ask .sw::after{display:none}
.who{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);font:600 14px/1.2 var(--b);color:var(--navy);white-space:nowrap}
.who.you{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:700 14.5px/1 var(--h);text-decoration:none;cursor:pointer;transition:box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 4px 14px rgba(0,0,77,.16)}
.btn.solid{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.shot{border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,39,.10)}
.lbl{font:700 14px/1.2 var(--h);letter-spacing:.13em;text-transform:uppercase;color:#4A4A81}
.foot{padding:40px 0 60px;color:var(--muted);font-size:14px}
@media (max-width:760px){
 .wrap,.bar-in{padding:0 16px}.bar-in{gap:10px;height:58px}
 .mark b{display:none}.mark img{width:32px;height:32px}
 .nav{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
 .nav a{padding:18px 8px;font-size:14px}.nav a.on::after{left:8px;right:8px;bottom:10px}
 .nav .l{display:none}.nav .s{display:inline}
 .tbtn span.t{display:none}.tbtn{padding:0 10px}
 .tools .mo{display:none}
 .ph{padding-top:28px;padding-bottom:18px}.ph h1{font-size:29px}.ph p{font-size:16px}
}


/* ===== shell additions (Bob): phone nav shows all seven tabs; home view hides the nav like Launchpad A ===== */
body.at-home{background:var(--ink)}
body.at-home .bar{background:transparent;border-bottom-color:rgba(161,161,208,.22);position:absolute;left:0;right:0}
body.at-home .bar .nav{visibility:hidden}
body.at-home .bar .mark b{color:#fff}body.at-home .bar .tbtn{background:transparent;color:#fff;border-color:rgba(161,161,208,.45)}
.mark b{white-space:nowrap}
.scr{display:none}.scr.on{display:block}
html.moved .scr.on{animation:scrIn .4s cubic-bezier(.2,.7,.2,1)}
@keyframes scrIn{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.zoomfx{position:fixed;z-index:60;border-radius:20px;background:var(--paper);transition:all .36s cubic-bezier(.5,0,.2,1);pointer-events:none}
.zoomfx.go{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.zoomfx.out{opacity:0;transition:opacity .35s}
html.still .zoomfx{display:none}
@media (prefers-reduced-motion:reduce){.zoomfx{display:none}html.moved .scr.on{animation:none}}
.foot b{font-weight:600}
@media (max-width:760px){
 .bar-in{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:0;row-gap:2px}
 .bar .mark{order:1}.bar .tools{order:2;margin-left:auto}
 .bar .nav{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(4,1fr);width:100%;overflow:visible;-webkit-mask-image:none;mask-image:none;margin:0;padding:0 0 6px;gap:0}
 .bar .nav a{padding:11px 2px 12px;text-align:center;justify-content:center;font:600 14px/1 var(--h)}.bar .nav a.on::after{left:18%;right:18%;bottom:4px}
 body.at-home .bar .nav{display:none}
 .mark b{display:inline;font-size:14px}
 .tools .mo{display:inline-flex}.tools .mo{padding:0 10px}
}
/* launcher bar: the mark stays white on the dark bar; hover = underline only */
body.at-home .bar .mark,body.at-home .bar .mark:hover{color:#fff}
.mark:hover b{text-decoration:underline;text-underline-offset:4px}
/* ===== Launchpad A ===== */
.app{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;width:116px}
.app .tile{position:relative;display:grid;place-items:center;width:68px;height:68px;border-radius:20px;transition:transform .2s,box-shadow .2s;animation:arrive .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes arrive{from{transform:translateY(14px) scale(.86)}to{transform:none}}
html.seen .app .tile,html.seen .note{animation:none}
.app:hover .tile{transform:translateY(-3px)}
.app .nm{font:600 14px/1.25 var(--h);text-align:center}
.badge{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--ink);font:800 14px/26px var(--h);text-align:center;border:2.5px solid var(--bdg,#000027)}
.note ol{margin:0;padding:0;list-style:none;counter-reset:a}
.note li{counter-increment:a;position:relative;padding-left:34px;margin-top:14px}
.note li::before{content:counter(a);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font:700 14px/24px var(--h);text-align:center}
.note li p{margin:0;font-size:15.5px;line-height:1.5}
.note li p.wh{margin-top:6px;font-size:14.5px;color:#3A3A75}
.nh{display:flex;gap:14px;align-items:center}
.cnt{flex:none;width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--ink);font:800 21px/44px var(--h);text-align:center}
.note h2{font-size:21px;font-weight:800}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:700 14.5px/1.2 var(--h);color:var(--navy)}
.m2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.m2b{flex:1 1 180px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--body)}
.m2b b{display:block;font:800 15px/1.2 var(--h);color:var(--navy)}.m2b span{display:block;font-size:14px;line-height:1.35;color:#4F5560;margin-top:3px}
.nowc .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0;padding:0;list-style:none}
.nowc .steps li{padding-top:12px;border-top:4px solid #C8C8CC}
.nowc .steps li b{display:block;font:700 15px/1.25 var(--h);color:var(--navy)}
.nowc .steps li span{display:block;font-size:14px;color:#4F5560;margin-top:2px}
.nowc .n-live{border-top-color:var(--navy)!important}.nowc .n-ask{border-top-color:var(--gold)!important}
.nowc .n-notbuilt{border-top-style:dashed!important;border-top-color:#9A9AA6!important}
.nowc .sl{margin:14px 0 0;font-size:15px}
.nowc .last{margin:10px 0 0;font-size:14px;color:#4F5560}
.lpA{position:relative;min-height:100vh;padding:96px 32px 48px;color:#fff;overflow:hidden;
 background:radial-gradient(1100px 520px at 50% -8%,rgba(161,161,208,.30),transparent 62%),radial-gradient(800px 600px at 85% 110%,rgba(0,0,77,.9),transparent 70%),linear-gradient(180deg,#000E31,#000027 70%)}
.lpA::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 18%,rgba(161,161,208,.07) 0 1px,transparent 1px 64px);pointer-events:none}
.lpA>*{position:relative}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.hero img{width:118px;height:118px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.for{margin:16px 0 4px;font:600 15px/1.3 var(--b);color:#D6D6EE}.for b{color:#fff}
.hero h1{color:#fff;font-size:44px;font-weight:600;letter-spacing:-.02em}.hero h1 b{font-weight:900}
.apps{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 8px;margin:34px auto 0;max-width:940px}
.apps .tile{background:rgba(255,255,255,.07);border:1px solid rgba(161,161,208,.35);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.apps .hot .tile{background:#fff;color:var(--navy);border-color:#fff}
.apps .app{color:#fff}.apps .nm{color:#E6E6F5}
.dock{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;max-width:1040px;margin:30px auto 0;align-items:start}
.note,.nowc{background:#fff;color:var(--body);border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.note{border-top:5px solid var(--gold);animation:land .5s .55s cubic-bezier(.2,.8,.2,1) both;scroll-margin-top:90px}
.note.flash{box-shadow:0 0 0 4px var(--gold),0 24px 60px rgba(0,0,0,.35)}
@keyframes land{from{transform:translateY(16px)}to{transform:none}}
.lp-foot{max-width:1040px;margin:26px auto 0;color:#C9C9E6;font-size:14px}
@media (max-width:760px){
 .lpA{padding:84px 16px 36px}.hero img{width:92px;height:92px}.hero h1{font-size:31px}
 .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;margin-top:26px}.app{width:auto}.app .tile{width:58px;height:58px;border-radius:17px}.app .nm{font-size:14px}
 .dock{grid-template-columns:1fr;margin-top:24px}.note,.nowc{padding:18px}.nowc .steps{grid-template-columns:1fr;gap:12px}
}
/* ===== Your system B (+ A's lens switch, Ways in, From your Lives) ===== */
.det{display:grid;grid-template-columns:minmax(300px,.8fr) 1.2fr;gap:36px;align-items:start}
.dtx h2{font-size:30px;font-weight:800;margin-top:6px}
.dtx .ttl{margin:8px 0 0;font:600 15.5px/1.4 var(--h);color:#3A3A75}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px}
.what{font-size:17px;margin:16px 0 0}
.where{display:flex;align-items:center;gap:7px;color:#3A3A75;font-size:14.5px;margin:12px 0 18px;overflow-wrap:anywhere}
.dshot{margin:0}.dshot img{width:100%;max-height:470px;object-fit:cover;object-position:top}
.lens{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line);margin:0 0 22px}
.lens button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font:700 14px/1 var(--h);color:#3A3A75;cursor:pointer}
.lens button.on{background:var(--navy);color:#fff}
.lnote{margin:-8px 0 20px;color:#3A3A75;font-size:15px}
.pane{display:none}.pane.on{display:block}
.fan{display:grid;grid-template-columns:330px 120px 1fr;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.src{display:block;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;font:inherit}
.src.on{box-shadow:0 0 0 4px rgba(161,161,208,.45),0 0 0 1px var(--navy)}
.src img{width:100%}
.src .t{display:block;padding:14px 16px 18px}.src .t .k{display:block;margin:0;color:#C9C9E6;font:700 14px/1.2 var(--h);letter-spacing:.12em;text-transform:uppercase}
.src .t b{display:block;margin-top:6px;font:800 18px/1.25 var(--h);color:#fff}
.src .t span{display:block;margin-top:10px;font-size:14px;color:#D6D6EE}
.wires{width:120px;height:100%;min-height:420px}
.dests{display:grid;gap:10px}
.dest{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:inherit}
.dest:hover{border-color:var(--navy)}
.dest.on{border-color:var(--navy);box-shadow:inset 5px 0 0 var(--navy)}
.dest .i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ice);color:var(--navy)}
.dest b{display:block;font:700 16px/1.25 var(--h);color:var(--navy)}.dest small{display:block;font-size:14px;color:#3A3A75;margin-top:2px}
.dwrap{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
.everyw{margin:18px 0 0;font-size:15px;color:#3A3A75}
.ways{display:grid;gap:12px}
.way{background:#fff;border:1px solid var(--line);border-radius:14px}
.way>button{display:grid;grid-template-columns:1.1fr 1.6fr;gap:20px;align-items:center;width:100%;text-align:left;padding:18px 20px;border:0;background:none;cursor:pointer;font:inherit;color:inherit;border-radius:14px}
.way>button:hover{background:var(--soft)}
.way h3{font-size:18px}.way .pl{color:#3A3A75;font-size:14.5px;margin:3px 0 8px}
.gets{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.gets .arr{color:var(--lav)}
.wayd{display:none;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:24px;padding:0 20px 20px;align-items:start}
.way.open .wayd{display:grid}
.wayd p{margin:0 0 12px;font-size:15.5px}
.wayd img{width:100%;max-height:340px;object-fit:cover;object-position:top}
.lives{display:grid;gap:12px}
.lv{display:grid;grid-template-columns:200px 1fr 1fr;gap:20px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.lv img{width:200px;border-radius:8px}
.lv b{font-family:var(--h);color:var(--navy)}
.lv .lks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lv .lks .btn{min-height:38px;padding:0 14px;font-size:14px}
.words{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.words h3{font-size:16px;font-weight:800;margin-bottom:8px}
.words dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 26px;margin:0}
.words div{font-size:14.5px;color:#3A3A75}.words dt{display:inline;font:700 14.5px var(--h);color:var(--navy)}.words dd{display:inline;margin:0}
@media (max-width:900px){.fan{grid-template-columns:1fr;padding:16px}.wires{display:none}.src{display:grid;grid-template-columns:130px 1fr}.src img{height:100%;object-fit:cover}.src .t b{font-size:15px}.src .t span{display:none}
 .dests{margin-top:12px;border-left:3px solid var(--lav);padding-left:12px}.dest{grid-template-columns:40px 1fr}.dwrap{padding:18px}.words dl{grid-template-columns:1fr}}
@media (max-width:760px){.det{grid-template-columns:1fr;gap:20px}.dtx h2{font-size:24px}
 .lens{display:flex;overflow-x:auto}.lens button{padding:10px 12px;white-space:nowrap}
 .way>button,.lv,.wayd{grid-template-columns:1fr}.lv img{width:100%}}
/* ===== Roadmap preview - combined C (Trey 2026-11-13, Michelangelo roadmap-preview-C.html) ===== */
.ask{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:16px;padding:22px 26px;box-shadow:0 14px 34px rgba(0,0,77,.08)}
.ah{display:flex;gap:14px;align-items:center}
.ask .cnt{width:42px;height:42px;font:800 20px/42px var(--h)}
.ask h2{font-size:22px;font-weight:800}
.ag{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;margin-top:14px}
.ai p{margin:6px 0 0;font-size:15.5px}
.ask .m2b{flex:1 1 170px}
.reply{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:#3A3A75}
.ask.bottom{margin-top:24px;padding:18px 24px}.ask.bottom p{margin:0;font-size:16px;color:var(--ink)}
.states{display:flex;flex-wrap:wrap;gap:10px 26px;margin:18px 0 0}
.states em{font-style:normal;color:#3A3A75;font-size:14.5px}
.journey{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 24px 20px}
.jh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.jh h3{font-size:20px;font-weight:800}.jh p{margin:4px 0 0;color:#3A3A75;font-size:15px}
.sw-tog{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.sw-tog .lb{font:600 14px/1 var(--b);color:#3A3A75;white-space:nowrap}
.sw-tog button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font:700 14px/1 var(--h);color:#3A3A75;cursor:pointer;white-space:nowrap}
.sw-tog button.on{background:var(--navy);color:#fff}
.jrow{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;gap:16px;margin-top:18px;padding-top:30px}
.jrow::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:3px;border-radius:2px;background:var(--lav)}

<script>
/* full screen: real full screen when the frame allows it, otherwise open the page on its own in a new tab */
(function(){const $$=s=>Array.from(document.querySelectorAll(s));
(function(){const b=document.getElementById('fsBtn'),lbl=b.querySelector('span');$$('[data-fs]').forEach(x=>x.addEventListener('click',()=>b.click()));
 const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
 const canFS=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
 if(inFrame&&!canFS){lbl.textContent='Open full screen';b.title='Opens your Blueprint in its own tab'}
 function sync(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);if(!(inFrame&&!canFS))lbl.textContent=on?'Exit full screen':'Full screen';b.setAttribute('aria-label',lbl.textContent)}
 function openTab(){window.open(location.href.split('#')[0].replace(/[?&]v=\d+/,'')+location.hash,'_blank','noopener')}
 b.addEventListener('click',()=>{
  if(canFS){const on=document.fullscreenElement||document.webkitFullscreenElement;
   if(on){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const el=document.documentElement;try{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(openTab)}catch(e){openTab()}}}
  else openTab();
 });
 document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);sync();
})();
})();
</script>
