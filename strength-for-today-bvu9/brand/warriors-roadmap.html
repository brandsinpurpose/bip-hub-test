/* shared brand-book components - all em-based, so the host decides the scale */
.bb-btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;white-space:nowrap;line-height:1.1}
.bb-abs{position:absolute;inset:0}
.bb-center{display:flex;align-items:center;justify-content:center}
.bb-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bb-tag{position:absolute;left:.8em;top:.8em;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:.35em .65em;border-radius:.3em;background:rgba(255,255,255,.86);color:#1b1b1b;z-index:2}
.bb-ovl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:7%}
.bb-ovl b{font-family:var(--display);font-weight:var(--d-weight);font-size:2.1em;line-height:1.02;letter-spacing:var(--d-track);max-width:92%}
.bb-ovl span{font-size:.85em;margin-top:.4em;opacity:.85}
.bb-art{position:relative;overflow:hidden;container-type:inline-size;font-size:clamp(7px,3.4cqw,15px)}
.bb-uic{width:19em;max-width:84%;padding:1em;border-radius:1.2em;box-shadow:0 1.8em 3.6em rgba(0,0,0,.35);font-size:.82em}
.bb-uih{display:flex;align-items:center;gap:.5em;padding-bottom:.6em;font-size:.85em}.bb-uih img{width:1.6em;height:1.6em;object-fit:contain}.bb-uih span{margin-left:auto;font-size:.7em;letter-spacing:.12em;opacity:.65;font-weight:700}
.bb-uil{padding:.9em 0 .1em;font-size:.62em;letter-spacing:.14em;font-weight:700}
.bb-uiv{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}.bb-uiv b{font-size:1.6em;letter-spacing:-.03em}.bb-uiv span{font-size:.62em;font-weight:700;padding:.3em .7em;border-radius:99em}
.bb-uib{display:flex;align-items:flex-end;gap:.32em;height:3em;margin:.7em 0 .5em}.bb-uib i{flex:1;border-radius:.25em .25em .06em .06em}
.bb-uir{display:flex;justify-content:space-between;font-size:.7em;padding:.5em 0}
.bb-uin{display:flex;justify-content:space-between;align-items:center;margin-top:.6em;padding:.7em .8em;border-radius:.8em;font-size:.72em}.bb-uin small{display:block;font-size:.72em;letter-spacing:.14em}.bb-uin i{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-style:normal}
.bb-wp{padding:.8em 1.1em;border-radius:.6em;font-weight:700;font-size:1.1em;box-shadow:0 .6em 1.8em rgba(0,0,0,.15)}
.bb-dec{width:17em;max-width:86%;border-radius:1.2em;padding:1.2em;display:flex;flex-direction:column;gap:.35em;box-shadow:0 2em 4em -1em rgba(0,0,0,.4);font-size:.82em}
.bb-dec small{font-size:.6em;letter-spacing:.16em;font-weight:700}.bb-dec b{font-size:1.4em;line-height:1.1;letter-spacing:-.02em}.bb-dec span{font-size:.78em;opacity:.8}
.bb-decm{display:flex;justify-content:space-between;align-items:center;margin:.6em 0;padding:.6em .7em;border-radius:.6em;background:rgba(255,255,255,.07);font-size:.65em;letter-spacing:.08em}.bb-decm em{font-style:normal}.bb-decm strong{font-size:1.6em;letter-spacing:-.02em}
.bb-dec>i{align-self:flex-start;font-style:normal;font-size:.7em;font-weight:700;padding:.6em 1em;border-radius:99em}
/* mockups */
.bb-mock{position:relative;overflow:hidden;border-radius:.9em;background:#fff;box-shadow:0 2.2em 4.4em -2em rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.05);font-family:var(--body);text-align:left}
.bb-chrome{display:flex;align-items:center;gap:.4em;padding:.6em .9em;background:#f3f4f5;border-bottom:1px solid rgba(0,0,0,.06)}.bb-chrome i{width:.6em;height:.6em;border-radius:50%;background:rgba(0,0,0,.14)}.bb-chrome span{margin-left:.7em;font-size:.7em;opacity:.55}
.bb-hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:2.4em;align-items:center;padding:4.6em 3.4em 3.4em;min-height:26em}
.bb-hnav{position:absolute;left:3.4em;right:3.4em;top:1.2em;display:flex;justify-content:space-between;align-items:center;font-size:.85em}.bb-hnav img{height:2em;width:auto}.bb-hnav>span{display:flex;gap:1.6em;opacity:.85}
.bb-heye{margin:0 0 .9em;font-size:.72em;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.bb-hcopy h4{margin:0 0 .5em;font-size:3.2em;line-height:1;text-wrap:balance}.bb-hcopy h4 span,.bb-hcopy h4 strong{display:block}
.bb-hsub{margin:0 0 1.4em;font-size:.95em;line-height:1.55;opacity:.85;max-width:30em}
.bb-hacts{display:flex;gap:.6em;flex-wrap:wrap}
.bb-hvis{position:relative;aspect-ratio:4/5;border-radius:1.2em;overflow:hidden;container-type:inline-size;font-size:clamp(6px,4.4cqw,15px)}
.bb-email{background:#f2f3f4}.bb-env{padding:.9em 1.2em;font-size:.82em;line-height:1.5;background:#fff;border-bottom:1px solid rgba(0,0,0,.07)}.bb-env span{opacity:.6}
.bb-sheet{margin:1.2em;border-radius:.8em;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.07)}
.bb-eh{padding:1.2em 1.5em}.bb-eh img{height:1.6em;width:auto}
.bb-eb{padding:1.6em 1.5em 1.8em}.bb-eb h5{margin:0 0 .5em;font-size:1.7em;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}.bb-eb p{margin:0 0 1.2em;font-size:.92em;line-height:1.55}
.bb-ef{padding:.9em 1.5em;border-top:1px solid rgba(0,0,0,.07);font-size:.72em;opacity:.6}
.bb-social{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:8%;font-size:clamp(7px,3.2cqw,15px)}
.bb-stop,.bb-sfoot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:1em;font-size:.68em;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.bb-stop img{height:2.6em;width:auto}
.bb-social h5{position:relative;margin:0;font-size:2.3em;line-height:1.02;text-wrap:balance}
.bb-sfoot i{width:3em;height:3em;border-radius:50%;display:grid;place-items:center}.bb-sfoot svg{width:1.4em;height:1.4em}
.bb-dl{font-size:.68em;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:inherit;text-decoration:none;opacity:.6;border-bottom:1px solid currentColor;padding-bottom:.1em}
.bb-dl:hover{opacity:1}
/* misuse */
.bb-mis img,.bb-mis svg{width:46%;height:auto}
.m-stretch>*{transform:scaleX(1.5)}.m-squash>*{transform:scaleY(.6)}.m-rotate>*{transform:rotate(-16deg)}
.m-recolor>*{filter:hue-rotate(150deg) saturate(1.6)}.m-effect>*{filter:drop-shadow(5px 6px 0 #000) drop-shadow(0 0 10px #ff0)}
.m-busy{background:repeating-conic-gradient(from 20deg at 30% 40%,#e3b04b 0 18deg,#3a7d44 18deg 40deg,#c4453c 40deg 64deg,#3b5ba5 64deg 90deg)!important}
.bb-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;z-index:90;padding:10px 16px;border-radius:999px;background:rgba(10,14,20,.88);color:#fff;font:600 13px/1.3 system-ui,sans-serif;display:flex;gap:10px;align-items:center;transition:opacity .2s,transform .2s;pointer-events:none;backdrop-filter:blur(8px)}
.bb-toast i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.bb-toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.bb-toast{transition:none}}
/* proposed dot, approvals, samples */
.bb-dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .22em color-mix(in srgb,var(--accent) 22%,transparent);vertical-align:middle;flex:none}
a.bb-dot{cursor:pointer}
.bb-chart{display:block;width:100%;height:auto}
.bb-chartkey{display:flex;flex-wrap:wrap;gap:.4em 1.2em;margin-top:.8em;font-size:.8em}.bb-chartkey span{display:flex;align-items:center;gap:.45em}.bb-chartkey i{width:.8em;height:.8em;border-radius:.2em}
.bb-send{display:inline-flex;align-items:center;gap:.6em;padding:.85em 1.4em;border-radius:99em;background:var(--action);color:var(--onAction);font-weight:700;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:700}
.bb-send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.bb-tick{appearance:none;-webkit-appearance:none;margin:0;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;transition:background .2s}
.bb-tick:checked{background:var(--accent)}
.bb-tick:checked:after{content:"";width:.45em;height:.8em;border:solid var(--onAction);border-width:0 2px 2px 0;transform:translateY(-.1em) rotate(45deg)}
.bb-tick:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* product first: in the website hero the app card leads, the photo sits behind it */
.bb-hvis .bb-uic{width:24em;max-width:88%;font-size:.98em}
@media (max-width:899px){.bb-hvis .bb-tag{font-size:11px;top:12px;left:12px}.bb-hvis .bb-center{padding-top:34px}}

/* ===================== FOLIO - the editorial brand book ===================== */
*{box-sizing:border-box}
html{background:color-mix(in srgb,var(--paper) 84%,var(--ink))}
body{margin:0;background:color-mix(in srgb,var(--paper) 84%,var(--ink));color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.book{padding:clamp(28px,5vw,72px) clamp(16px,3vw,48px) 40px;display:flex;flex-direction:column;gap:clamp(36px,6vw,84px);align-items:center}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(100%,1380px);box-shadow:0 40px 90px -40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.08);opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.75,.15,1)}
.spread.in{opacity:1;transform:none}
.spread.single{grid-template-columns:1fr;width:min(100%,690px)}
.spread:not(.single):not(.wide-s):after{content:"";position:absolute;top:0;bottom:0;left:50%;width:80px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.05) 45%,rgba(0,0,0,.11) 50%,rgba(0,0,0,.04) 55%,transparent);pointer-events:none;z-index:3}
.page{position:relative;aspect-ratio:5/6;background:var(--paper);color:var(--ink);overflow:hidden;container-type:inline-size;min-width:0}
.page.wide{grid-column:1/-1;aspect-ratio:10/6}
.page.white{background:#FFFFFF}
.page.dark{background:var(--dark);color:var(--onDark)}
.page.grow{overflow:visible}
.pi{position:absolute;inset:0;padding:8% 8% 9%;display:flex;flex-direction:column;font-size:2.25cqw;line-height:1.5}
.page.wide .pi{font-size:1.1cqw;padding:5% 5% 5.5%}
.page.grow .pi{position:relative;min-height:inherit}
.rh,.fo{position:absolute;left:8%;right:8%;display:flex;justify-content:space-between;gap:1em;font-size:.62em;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.5;z-index:4}
.page.wide .rh,.page.wide .fo{left:5%;right:5%}
.rh{top:3.2%}.fo{bottom:3.2%}
.lab{font-size:.68em;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.h{margin:0;font-family:var(--display);font-size:min(2.6em,7.5cqw);line-height:1.02;letter-spacing:-.035em;font-weight:var(--d-weight);text-wrap:balance}
.lead{margin:.8em 0 0;font-size:1.06em;line-height:1.55;opacity:.8;max-width:34em}
.muted{opacity:.65}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:1em;border-top:1px solid currentColor;padding-top:.7em;font-size:.9em;margin-top:auto}
.cap b{font-size:.72em;letter-spacing:.2em;text-transform:uppercase;opacity:.6;white-space:nowrap}
.cap span{flex:1}
/* cover */
.cv .mk{flex:1;display:grid;place-items:center}
.cv .mk>*{width:52%;height:auto;max-height:60cqw}
.cv h1{margin:0;font-family:var(--display);font-size:min(6.2em,14cqw);line-height:.88;letter-spacing:-.055em;font-weight:var(--d-weight)}
.cv h1 span{display:block;font-weight:var(--tv-sw)}
.cv .vol{display:flex;justify-content:space-between;margin-top:1.4em;font-size:.72em;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.75}
.toc{list-style:none;margin:1.4em 0 0;padding:0}
.toc li a{display:flex;align-items:baseline;gap:1em;padding:.36em 0;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent);font-family:var(--display);font-size:1.18em;letter-spacing:-.02em;font-weight:600;color:inherit;text-decoration:none}
.toc li a:hover{opacity:.7}
.toc li b{font-weight:300;font-size:.75em;width:2.2em;opacity:.5}
.quote2{margin:auto 0 1em;padding-top:1em;font-family:var(--display);font-size:1.4em;line-height:1.16;letter-spacing:-.02em;font-weight:var(--tv-sw)}
.quote2 strong{font-weight:var(--tv-pw);font-style:var(--tv-ps);color:var(--tv-pl)}
.colo{font-size:.82em;line-height:1.6;opacity:.75;margin-bottom:.6em}
/* chapter opener */
.op{justify-content:flex-end}
.op .num{font-family:var(--display);font-weight:200;font-size:min(17em,42cqw);line-height:.78;letter-spacing:-.07em;margin:0 0 auto;padding-top:4%}
.op h2{margin:0;font-family:var(--display);font-size:min(5.4em,13cqw);line-height:.9;letter-spacing:-.05em;font-weight:var(--d-weight)}
.op p{margin:1.1em 0 0;max-width:30em;font-size:1.06em;line-height:1.6;opacity:.8}
/* big statements */
.big{font-family:var(--display);font-size:min(4em,10cqw);line-height:.98;letter-spacing:-.045em;margin:auto 0 0;font-weight:var(--tv-pw)}
.big span{display:block;font-weight:var(--tv-sw)}
.big strong{display:block;font-style:var(--tv-ps)}
.stmts{display:flex;flex-direction:column;gap:1.3em;margin-top:2em}
.stmts div{border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);padding-top:.8em}
.stmts p{margin:.35em 0 0;font-size:1.02em}
.bq{margin:auto 0 0;padding-top:1em;font-family:var(--display);font-size:1.5em;line-height:1.22;letter-spacing:-.015em;font-weight:500}
.bq cite{display:block;margin-top:.7em;font-family:var(--body);font-size:.5em;letter-spacing:.18em;text-transform:uppercase;font-style:normal;font-weight:700;opacity:.6}
.pill-list{display:flex;flex-direction:column;margin-top:auto}
.pill-list div{display:grid;grid-template-columns:3em 1fr;gap:.6em;padding:1.1em 0;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.pill-list i{font-style:normal;font-family:var(--display);font-weight:200;font-size:2em;line-height:1;opacity:.6}
.pill-list b{display:block;font-family:var(--display);font-size:1.7em;letter-spacing:-.025em;line-height:1.1}
.pill-list span{opacity:.75}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:1em;margin-top:2em}
.segs div{padding:1.1em;border-radius:.8em;background:color-mix(in srgb,currentColor 5%,transparent)}
.segs b{display:block;font-family:var(--display);font-size:1.2em;letter-spacing:-.015em;margin:.3em 0 .25em}
.segs span{font-size:.9em;opacity:.75}
.words{display:grid;grid-template-columns:1fr 1fr;margin-top:auto;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.words div{padding:1em 0;border-bottom:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.words div:nth-child(odd){padding-right:1em}
.words b{display:block;font-family:var(--display);font-size:1.75em;letter-spacing:-.025em;font-weight:var(--d-weight);line-height:1.1}
.words span{font-size:.9em;opacity:.7}
/* plates */
.plate{flex:1;position:relative;display:grid;place-items:center;margin:4% 0;min-height:0}
.plate>*:not(i){position:absolute;left:21%;top:8%;width:58%;height:84%;object-fit:contain}
.plate.wide>*:not(i){left:8%;top:15%;width:84%;height:70%}
.crop:before,.crop:after,.crop>i:before,.crop>i:after{content:"";position:absolute;width:1.6em;height:1.6em;border-color:currentColor;border-style:solid;opacity:.3}
.crop:before{top:0;left:0;border-width:1px 0 0 1px}.crop:after{top:0;right:0;border-width:1px 1px 0 0}
.crop>i{position:absolute;inset:0;pointer-events:none}.crop>i:before{bottom:0;left:0;border-width:0 0 1px 1px}.crop>i:after{bottom:0;right:0;border-width:0 1px 1px 0}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em;margin:auto 0 0;align-content:end}
.fam figure{margin:0;display:flex;flex-direction:column;min-height:0}
.fam .t{aspect-ratio:1;display:grid;place-items:center;border-radius:.4em;padding:20%}
.fam .t>*{width:100%;height:100%;object-fit:contain}
.fam figcaption{display:flex;justify-content:space-between;gap:.6em;font-size:.72em;padding-top:.5em;align-items:baseline}
.fam figcaption .bb-dl{font-size:.85em}
.clear{flex:1;display:grid;place-items:center;min-height:0}
.cs{position:relative;display:inline-block;padding:calc(var(--r) * 10em);border:1px dashed var(--accent);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 12%,transparent) 0 5px,transparent 5px 10px)}
.cs>svg,.cs>img{display:block;height:10em;width:auto}
.cs .in{position:absolute;inset:calc(var(--r) * 10em);background:var(--surface);outline:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.cs>svg,.cs>img{position:relative;z-index:1}
.cs em{position:absolute;font-style:normal;font-size:.8em;font-weight:700;color:var(--accent)}
.cs em.t{top:calc(var(--r) * 5em);left:50%;transform:translate(-50%,-50%)}.cs em.l{left:calc(var(--r) * 5em);top:50%;transform:translate(-50%,-50%)}
.mins{display:flex;gap:1.4em;align-items:flex-end;margin-top:1em;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);padding-top:1em}
.mins div{display:flex;flex-direction:column;gap:.4em;font-size:.82em}
.mins div>*:first-child{width:auto}
.mis{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin-top:1.4em;align-content:start}
.mis figure{margin:0}
.mis .st{position:relative;aspect-ratio:1;border-radius:.4em;display:grid;place-items:center;overflow:hidden;background:#fff}
.mis .st:after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(0,0,0,.5) 50%,transparent calc(50% + 1px))}
.mis figcaption{font-size:.78em;padding-top:.4em;line-height:1.35}
.mis figcaption b{display:block}
/* colour */
.fan{flex:1;position:relative;margin:4% 0 0;min-height:0}
.fan button{position:absolute;left:30%;bottom:4%;width:40%;height:82%;border:0;padding:0;cursor:pointer;background:#fff;border-radius:.5em;box-shadow:0 1.4em 3em -1em rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,.75,.15,1);display:flex;flex-direction:column-reverse;text-align:left;font:inherit;color:var(--ink)}
.fan button i{flex:1;border-radius:0 0 .5em .5em}
.fan button span{padding:.7em .7em .8em;font-size:.72em;line-height:1.35;white-space:nowrap}
.fan button span b{display:block;font-size:1.15em}
.fan{--k:1}.fan button{transform:translateX(calc(var(--i) * var(--tx) * var(--k))) rotate(var(--r))}
.fan:hover button{transform:translateX(calc(var(--i) * var(--tx) * var(--k) * 1.15)) rotate(calc(var(--r) * 1.25))}
.cpage{cursor:pointer}
.cpage .pi{justify-content:flex-end}
.cpage .nm{font-family:var(--display);font-size:min(6em,15cqw);line-height:.88;letter-spacing:-.055em;font-weight:var(--d-weight);margin:.15em 0 0}
.cpage .use{margin:1em 0 0;max-width:24em;font-size:1.02em;line-height:1.55;opacity:.85}
.cpage .vals{position:absolute;top:9%;right:8%;text-align:right;font-size:.85em;line-height:1.8;opacity:.85;font-variant-numeric:tabular-nums}
.cpage .vals em{display:block;font-style:normal;font-size:.75em;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:.4em}
.cpage .pct{position:absolute;top:8%;left:8%;font-family:var(--display);font-weight:200;font-size:min(4em,10cqw);letter-spacing:-.04em;opacity:.55}
.cpage:focus-visible{outline:3px solid var(--accent);outline-offset:-6px}
.poster{flex:1;display:flex;flex-direction:column;margin:1.6em 0 0;border-radius:.3em;overflow:hidden;min-height:0}
.poster div{display:flex;align-items:flex-end;justify-content:space-between;padding:.8em 1em;font-size:.72em;letter-spacing:.16em;text-transform:uppercase;font-weight:700;min-height:2.2em}
.poster div b{font-family:var(--display);font-size:2.6em;font-weight:200;letter-spacing:-.04em;text-transform:none;line-height:.9}
.pairs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.8em;margin-top:1.4em;min-height:0}
.pairs div{border-radius:.5em;padding:1em;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.pairs p{margin:0;font-family:var(--display);font-size:1.5em;line-height:1.05;letter-spacing:-.02em;font-weight:var(--d-weight)}
.pairs small{font-size:.72em;line-height:1.4;opacity:.85}
.pairs small b{display:block;font-size:1.3em}
.sup{flex:1;display:flex;flex-direction:column;gap:.8em;justify-content:center}
.sup button{display:grid;grid-template-columns:5.6em 1fr auto;gap:1em;align-items:center;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sup button i{height:5.6em;border-radius:.4em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sup button b{display:block;font-size:1.05em}
.sup button span{font-size:.82em;opacity:.65}
.sup button em{font-style:normal;font-size:.8em;opacity:.55;font-variant-numeric:tabular-nums}
/* type */
.tf .glyph{font-size:min(13em,32cqw);line-height:.85;letter-spacing:-.04em;margin:auto 0 .1em}
.tf .name{font-size:2.2em;letter-spacing:-.02em;line-height:1.05}
.tf .set{margin:.8em 0;font-size:1.05em;line-height:1.5;opacity:.85;word-break:break-all}
.tf .wts{display:flex;flex-wrap:wrap;gap:.3em 1em;font-size:1em}
.tf .why{margin:.9em 0 0;font-size:.9em;opacity:.75;max-width:30em}
.tv{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:.8em;margin-top:1.4em;min-height:0}
.tv div{border-radius:.5em;padding:1.2em;display:flex;flex-direction:column;justify-content:space-between}
.tv p{margin:0;font-family:var(--display);font-size:min(2.5em,6cqw);line-height:1.02;letter-spacing:var(--d-track)}
.tv p span{display:block;font-weight:var(--tv-sw)}.tv p strong{display:block;font-weight:var(--tv-pw);font-style:var(--tv-ps)}
.scale{display:flex;flex-direction:column;margin-top:1.2em;min-height:0}
.scale div{display:grid;grid-template-columns:7.5em 1fr;gap:1em;align-items:baseline;padding:.75em 0;border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.scale small{font-size:.68em;line-height:1.5;opacity:.65}
.scale small b{display:block;font-size:1.25em;opacity:1;color:var(--ink)}
.scale p{margin:0;min-width:0;overflow-wrap:break-word;text-wrap:balance}
.proof{margin-top:auto;padding:1.3em 1.4em;border-radius:.6em;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.proof p{margin:.6em 0 0;max-width:34em;text-wrap:pretty}
/* space */
.bars{display:flex;flex-direction:column;gap:.45em;margin-top:1.6em}
.bars div{display:grid;grid-template-columns:3.6em 3.6em 1fr;gap:.8em;align-items:center;font-size:.85em}
.bars i{display:block;height:.9em;background:var(--accent);border-radius:.15em}
.gridv{display:grid;height:9em;gap:.5em;margin-top:1.4em}
.gridv i{background:color-mix(in srgb,var(--accent) 22%,transparent);border-left:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-right:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em;margin-top:auto}
.tiles div{display:flex;flex-direction:column;gap:.5em;font-size:.8em}
.tiles i{display:block;aspect-ratio:1;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* imagery */
.ip{flex:1;display:flex;flex-direction:column;gap:1em;margin-top:1.2em;min-height:0}
.ip figure{margin:0;flex:1;display:flex;flex-direction:column;min-height:0}
.ip .bb-art{flex:1;border-radius:.5em;min-height:0}
.ip figcaption{display:flex;gap:.7em;align-items:baseline;padding-top:.5em;font-size:.86em}
.ip .dont{flex:none;flex-direction:row;align-items:center;gap:1.1em;padding-top:.6em;border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.ip .dont .bb-art{flex:none;width:30%;aspect-ratio:4/3;filter:grayscale(.85) contrast(.9);opacity:.75;font-size:.5em}
.ip .dont figcaption{flex:1;padding-top:0;flex-direction:column;gap:.4em}
.ip .dont figcaption i{align-self:flex-start}
.ip figcaption i{font-style:normal;font-size:.75em;letter-spacing:.14em;font-weight:700;padding:.2em .5em;border-radius:.25em;flex:none}
.ip .do figcaption i{background:var(--ink);color:var(--paper)}
.ip .dont figcaption i{border:1px solid currentColor}
.prin{display:flex;flex-direction:column;margin-top:auto}
.prin div{display:grid;grid-template-columns:8em 1fr;gap:1em;padding:.8em 0;border-top:1px solid color-mix(in srgb,currentColor 16%,transparent)}
/* elements */
.brow{display:grid;grid-template-columns:7em 1fr 1fr;gap:.8em;align-items:center;padding:1em 0;border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.brow.dk{background:var(--dark);color:var(--onDark);padding:1em;border-radius:.5em;border:0;margin-top:.6em}
.brow>span:first-child{font-size:.85em;font-weight:700}
.brow small{display:block;font-size:.62em;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-bottom:.4em}
.fld{margin-top:1.1em}
.fld label{display:block;font-size:.85em;font-weight:600;margin-bottom:.4em}
.fld div{display:flex;align-items:center;min-height:3.2em;padding:0 1em;font-size:1em}
.fld small{display:block;margin-top:.4em;font-size:.8em}
.opts{display:flex;flex-direction:column;gap:.5em;margin-top:1.4em;font-size:.95em}
.opts span{display:flex;align-items:center;gap:.7em}
.opts i{width:1.4em;height:1.4em;border:1.5px solid;display:grid;place-items:center;font-style:normal;font-size:.9em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.9em;margin-top:1.6em;flex:1;align-content:center}
.cards>div{padding:1.3em}
.cards small{display:block;font-size:.66em;letter-spacing:.14em;font-weight:700}
.cards b{display:block;font-family:var(--display);line-height:1.1;letter-spacing:-.02em;margin:.6em 0 .4em}
.cards span{font-size:.85em;opacity:.85;line-height:1.45}
.badges{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1.4em}
.badges span{padding:.35em .8em;font-size:.82em;font-weight:700}
.sig{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:1.3em 1.4em;margin-top:1.4em}
.sig small{display:block;font-size:.68em;letter-spacing:.16em;font-weight:700}
.sig b{display:block;margin-top:.4em;font-size:1.15em}
.sig i{flex:none;width:2.8em;height:2.8em;border-radius:50%;display:grid;place-items:center}
.sig svg{width:1.3em;height:1.3em}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em;margin-top:auto}
.icons div{display:flex;flex-direction:column;align-items:center;gap:.5em;padding:1em .4em;border-radius:.5em;background:color-mix(in srgb,currentColor 4%,transparent);font-size:.72em;text-align:center}
.icons svg{width:2.4em;height:2.4em}
.qb{margin:auto 0 0;padding:1.6em;border-radius:.8em;position:relative}
.qb blockquote{margin:1.6em 0 1em;font-family:var(--display);font-size:1.45em;line-height:1.25;letter-spacing:-.015em;font-weight:500}
.qb .qm{position:absolute;top:.1em;left:.5em;font-family:Georgia,serif;font-size:4.6em;line-height:1}
.qb figcaption{font-size:.85em}.qb figcaption b{display:block}
.blist{list-style:none;margin:1.4em 0 0;padding:0}
.blist li{display:flex;gap:.8em;align-items:flex-start;padding:.45em 0}
.blist li i{flex:none;width:.6em;height:.6em;border-radius:50%;margin-top:.5em}
.hf{display:flex;flex-direction:column;gap:1em;margin-top:1.4em;font-size:.72em}
.hfn{display:flex;align-items:center;gap:1.6em;padding:1.1em 1.6em;border-radius:.7em;box-shadow:0 1em 2em -1.4em rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05)}

html += `<p class="endnote">${B.guide.show ? `<span>For your build team: the full specifications, files and code live in <a href="${esc(B.guide.href)}">${esc(B.guide.label)}</a>.</span>` : ''}<span>${esc(brand.name)} · ${esc(brand.date || '')}</span></p>`;
document.getElementById('app').innerHTML = html;
document.getElementById('app').insertAdjacentHTML('afterbegin', `<div class="topbar"><span>${esc(brand.name)} · Brand Book</span><span class="tb-hint">Number keys jump to a chapter</span><button class="present-btn" id="presentBtn" aria-label="Present"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 9l4 2-4 2z" fill="currentColor"/><path d="M8 21h8M12 17v4"/></svg>Present <kbd>P</kbd></button></div>`);
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: .08 });
document.querySelectorAll('.spread').forEach(s => io.observe(s));
document.querySelectorAll('.cpage').forEach(p => p.addEventListener('keydown', e => { if (e.key === 'Enter'){ B.copy(p.dataset.copy, p.dataset.copyLabel, p.dataset.swatch); } }));
/* ---------- sign-off ticks -> approval email ---------- */
const ticks = [...document.querySelectorAll('.bb-tick')], send = document.getElementById('sendApprovals');
ticks.forEach(x => x.addEventListener('change', () => { const on = ticks.filter(k => k.checked).map(k => k.dataset.g); if (send){ send.href = B.approvalMail(on); document.getElementById('sendCount').textContent = `${on.length} of ${ticks.length} ticked`; } }));
/* ---------- present mode: one SPREAD per screen, built from the same spreads ---------- */
const slides = [...document.querySelectorAll('.spread')];
const slideOf = el => slides.indexOf(el && el.closest('.spread'));
const chapStart = B.CHAPTERS.map(c => slideOf(document.getElementById('ch-' + c.id)));
let cur = 0, on = false;
const back = document.getElementById('backdrop'), bar = document.getElementById('dbar');
back.style.background = `radial-gradient(80% 70% at 50% 40%, ${B.mix(T.dark, '#000000', .25)}, ${B.mix(T.dark, '#000000', .55)})`;
document.documentElement.style.setProperty('--dc', T.onDark);
function show(i, instant){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, k) => { if (instant) el.style.transition = 'none'; el.classList.toggle('cur', k === cur); el.classList.toggle('before', k < cur); });
  if (instant){ void document.body.offsetHeight; slides.forEach(el => el.style.transition = ''); }
  const first = pages[+slides[cur].querySelector('.page').dataset.p] || {};
  let ch = ''; B.CHAPTERS.forEach((c, k) => { if (chapStart[k] > -1 && chapStart[k] <= cur) ch = c.title; });
  document.getElementById('dname').textContent = cur === 0 ? brand.name : (ch || first.label || '');
  document.getElementById('dcount').textContent = String(cur + 1).padStart(2,'0') + ' / ' + String(slides.length).padStart(2,'0');
  bar.style.transform = `scaleX(${(cur + 1) / slides.length})`;
}
/* present type floor: every readable line at 14px or more (drawn app screens and website mockups excepted) */
const FLOOR_SKIP = '.bb-mock,.bb-uic,.bb-dec,.bb-wp,.hf,svg,.dchrome,.dnav';
function floorType(){ document.querySelectorAll('[data-fl]').forEach(el => { el.style.fontSize = ''; el.removeAttribute('data-fl'); }); if (!on) return;
  document.querySelectorAll('.book .page *').forEach(el => { if (el.closest(FLOOR_SKIP)) return; if (![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return; const fs = parseFloat(getComputedStyle(el).fontSize); if (fs < 13.95){ el.style.fontSize = '14px'; el.setAttribute('data-fl', ''); } }); }
function enter(){ if (on || !matchMedia('(min-width: 900px)').matches) return; on = true; const y = innerHeight * .45; let best = 0; slides.forEach((el, k) => { if (el.getBoundingClientRect().top < y) best = k; }); document.body.classList.add('present'); show(best, true); floorType(); }
addEventListener('resize', () => { if (on) floorType(); });
B.onPresent(v => v ? enter() : exit());
function exit(){ if (!on) return; on = false; document.body.classList.remove('present'); floorType(); slides.forEach(el => el.classList.remove('cur','before')); const el = slides[cur]; if (el){ el.classList.add('in'); el.scrollIntoView({ block: 'center' }); } if (document.fullscreenElement) document.exitFullscreen(); }
function goChapter(n){ const k = n - 1; if (!B.CHAPTERS[k] || chapStart[k] < 0) return; if (on) show(chapStart[k]); else { const el = document.getElementById('ch-' + B.CHAPTERS[k].id); el && el.scrollIntoView({ behavior: B.RM ? 'auto' : 'smooth', block: 'center' }); } }
document.getElementById('presentBtn').onclick = enter;
document.getElementById('dexit').onclick = exit;
document.getElementById('dprev').onclick = () => show(cur - 1);
document.getElementById('dnext').onclick = () => show(cur + 1);
/* in present mode: in-book links jump to their slide; a click on the right half goes forward, left half back */
document.addEventListener('click', e => {
  if (!on) return;
  const a = e.target.closest('a[href^="#"]');
  if (a){ e.preventDefault(); const k = slideOf(document.getElementById(a.getAttribute('href').slice(1))); if (k > -1) show(k); return; }
  if (e.target.closest('a,button,summary,details,input,label,[data-copy],.dchrome,.dnav')) return;
  show(cur + (e.clientX > innerWidth / 2 ? 1 : -1));
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)){ goChapter(e.key === '0' ? 10 : +e.key); return; }
  if (!on){ if (e.key === 'p' || e.key === 'P') enter(); return; }
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home'){ e.preventDefault(); show(0); } else if (e.key === 'End'){ e.preventDefault(); show(slides.length - 1); }
  else if (e.key === 'Escape') exit(); else if (e.key === 'p' || e.key === 'P') exit();
  else if (e.key === 'f' || e.key === 'F'){ document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); }
});
let sx = null; addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => { if (!on || sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
let wl = 0; addEventListener('wheel', e => { if (!on || e.target.closest('.page.grow')) return; const t = Date.now(); if (t - wl < 650 || Math.abs(e.deltaY) < 25) return; wl = t; show(cur + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
window.__folio = { pages: slides.length, slides: slides.length, chapters: chapStart, enter, exit, show, cur: () => cur };
})();
</script>
</body>
</html>
